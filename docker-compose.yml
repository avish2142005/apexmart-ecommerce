  admin-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecommerce-admin-service
    command: uvicorn services.admin_service.main:app --host 0.0.0.0 --port 8015
    environment:
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db
      - ADMIN_SERVICE_PORT=8015
    ports:
      - "8015:8015"
    depends_on:
      - postgres
    networks:
      - ecommerce-net

  # -------------------------------------------------------------
  # FRONTEND UI
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
