  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecommerce-analytics-service
    command: uvicorn services.analytics_service.main:app --host 0.0.0.0 --port 8014
    environment:
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db
      - ANALYTICS_SERVICE_PORT=8014
    ports:
      - "8014:8014"
    depends_on:
      - postgres
    networks:
